upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name 158.220.126.228 api.shaikly.com; # Replace with your domain if you have one later

    # 2. SERVE DJANGO API (Backend)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }


    # 4. STATIC FILES (Django Admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # 5. MEDIA FILES (User Uploads)
    location /media/ {
        alias /app/media/;
    }
}