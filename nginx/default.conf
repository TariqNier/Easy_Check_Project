upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name 158.220.126.228; # Replace with your domain if you have one later

    # 1. SERVE REACT (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This line fixes "Refresh 404" errors in React Router
        try_files $uri $uri/ /index.html;
    }

    # 2. SERVE DJANGO API (Backend)
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    # 3. SERVE DJANGO ADMIN
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    # 4. STATIC FILES (Django Admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # 5. MEDIA FILES (User Uploads)
    location /media/ {
        alias /app/media/;
    }
}