upstream django {
    server web:8000;
}

# ==========================================
# 1. HTTP BLOCK (Redirects everyone to HTTPS)
# ==========================================
server {
    listen 80;
    server_name api.shaikly.com 158.220.126.228;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://api.shaikly.com$request_uri;
}

# ==========================================
# 2. HTTPS BLOCK (The Secure API)
# ==========================================
server {
    listen 443 ssl;
    server_name api.shaikly.com;

    # SSL KEYS (Generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.shaikly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shaikly.com/privkey.pem;

    # Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SERVE DJANGO (API)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Crucial for Django to know it's secure
        client_max_body_size 100M;
    }

    # STATIC FILES (Django Admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # MEDIA FILES (User Uploads)
    location /media/ {
        alias /app/media/;
    }
}